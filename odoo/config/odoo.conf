[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Master password for the database-manager UI (change for anything public).
admin_passwd = nadi-master-change-me

; Database connection (also provided via env HOST/USER/PASSWORD).
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Dev conveniences — remove/limit in production.
; NB: dev reload uses an inotify watcher that misbehaves on 9p bind-mounts
; (spurious restarts), so it is intentionally omitted. Use update-module.sh
; to apply addon changes.
list_db = True
dev_mode = qweb
